  theme: light
  recent_limit: 20
  open_monitor: 0
  sidebar_collapsed: false
  debug: false
  minimize_to_tray: false
updates:
  enabled: true
  check_on_start: true
  manifest_url: https://api.github.com/repos/coopik/GTA-W-Dispatch-Relay/releases/latest
  allow_prerelease: false
  timeout: 15
reporting:
